name: macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set app version
        run: echo "NOTE_FOREST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build macOS installer
        run: npm run build:macos

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/macos/note-forest-macos.dmg \
            --title "노트숲 $GITHUB_REF_NAME" \
            --generate-notes
